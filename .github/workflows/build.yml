name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'pytest node ids to run instead of the full suite'
        required: false
        default: ''

env:
  PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/

jobs:
  tests:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: 3.9
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10'
            continue-on-error: false
          - platform: ubuntu-latest
            runner: ubuntu-22.04
          - platform: ubuntu-latest
            tox-env: py39
            python-version: '3.9.16'
          - platform: ubuntu-latest
            tox-env: py310
            python-version: '3.10.11'
          - platform: ubuntu-latest
            tox-env: py311
            python-version: '3.11.3'
          - platform: ubuntu-latest
            tox-env: nolxml
            python-version: '3.11.3'
          - platform: ubuntu-latest
            tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.runner || matrix.platform }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      env:
        PYTEST_ADDOPTS: -rs
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m tox -x "testenv.commands=pytest ${{ inputs.test-filter }}" -x "testenv:nolxml.commands=pytest ${{ inputs.test-filter }}" -x "testenv:nohtml5lib.commands=pytest ${{ inputs.test-filter }}"
        else
          python -m tox -x "testenv.commands=pytest --cov soupsieve --cov-append ."
        fi
    - name: Package
      if: matrix.platform == 'ubuntu-latest' && matrix.tox-env == 'py39'
      run: |
        echo "hatchling==1.14.0" > "$RUNNER_TEMP/build-constraints.txt"
        PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt" python -m build -s -w
    - name: Upload distributions
      if: matrix.platform == 'ubuntu-latest' && matrix.tox-env == 'py39'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error

  lint:
    if: false
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Lint
      run: |
        python -m tox

  documents:
    if: false
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: documents

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Build documents
      run: |
        python -m tox
